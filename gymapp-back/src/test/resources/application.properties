# Configuración de tests. Reemplaza entera a src/main/resources/application.properties
# en el classpath de test: ningún test se conecta a la MySQL local ni escribe en ella.
# Así corren igual en tu máquina, en el sandbox de Sandcastle y en CI (ADR-0005).

spring.datasource.url=jdbc:h2:mem:gym_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Sin seeders: DataLoader y HeavyDataLoader cargan cientos de registros.
app.seed.enabled=false
