# Compuerta G4 — la única que sobrevive a que alguien trabaje sin el harness puesto.
#
# Corre EXACTAMENTE el mismo verify.sh que los hooks locales y que Cowork. Si la
# compuerta de CI y la local difieren, la local no sirve para nada.
#
# Usa los scripts vendoreados en .harness/scripts/ del propio repo (los deja
# install.sh). No clona commons: el runner no tiene por qué conocer tu workspace,
# y un CI que depende de una ruta local de tu máquina no es un CI.
#
# Se copia a .github/workflows/harness.yml del proyecto.

name: harness

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gymapp es monorepo: Java 21 para gymapp-back, Node para gym-frontend.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gym-frontend/package-lock.json

      - name: Instalar dependencias del proyecto
        run: |
          INSTALL="$(python3 .harness/scripts/harness_config.py commands.install --default '')"
          if [ -n "$INSTALL" ]; then
            eval "$INSTALL"
          else
            echo "Sin commands.install en harness.config.yml — se omite."
          fi

      - name: verify — lint + typecheck + tests + spec_coverage
        run: bash .harness/scripts/verify.sh

      - name: Reporte de cobertura de specs
        if: always()
        run: python3 .harness/scripts/spec_coverage.py --json
